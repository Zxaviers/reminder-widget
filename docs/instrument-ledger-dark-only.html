<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>BRONE Reminder · Instrument Ledger (dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css" />
<style>
/* Hallmark · macrostructure: timeline-ledger · tone: industrial-utilitarian · anchor hue: 172 (teal) */
/* direction: IBM Plex Mono carries every time/code, Manrope carries titles; the list is a
   vertical time rail with urgency nodes; one hero card; no icon chips, no chevrons, no glow */
:root {
  --canvas: #14151A;
  --raised: #1C1D24;
  --raised-2: #22232B;
  --divider: #2A2B33;
  --teal: #5BB5A6;
  --ink-900: #F2F1EE;
  --ink-600: #B8B6B0;
  --ink-400: #6E6D68;
  --safe: #5CAE7E;
  --soon: #D6A44F;
  --overdue: #C14A4A;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  --sans: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas); font-family: var(--sans); }
body { padding: 16px; }
.widget {
  width: 360px;
  background: var(--canvas);
  border-radius: 16px;
  padding: 16px;
  display: flex; flex-direction: column;
}

/* ---- header ---- */
.header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.wordmark { color: var(--teal); font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
.count { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink-400); }
.head-right { display: flex; align-items: center; gap: 2px; }
.sync { font-family: var(--mono); font-size: 11px; color: var(--ink-400); padding-right: 4px; }
.icon-btn {
  width: 44px; height: 44px; margin-right: -10px;
  border: 0; background: transparent; border-radius: 6px;
  color: var(--ink-600); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 120ms var(--ease-out), color 120ms var(--ease-out);
}
.icon-btn:hover { background: var(--raised); color: var(--ink-900); }
.icon-btn:active { background: var(--raised-2); }
.icon-btn:focus-visible, .row-open:focus-visible, .row-done:focus-visible, .btn:focus-visible, .done-btn:focus-visible {
  outline: 2px solid var(--teal); outline-offset: 2px;
}

/* ---- hero: the one urgent moment ---- */
.hero {
  margin-top: 12px;
  background: var(--raised);
  border-left: 3px solid var(--overdue);
  border-radius: 12px;
  padding: 14px 16px 16px;
}
.hero-top { display: flex; align-items: center; gap: 8px; }
.hero-code { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink-400); letter-spacing: 0.02em; }
.hero-name { font-size: 12px; font-weight: 600; color: var(--ink-600); }
.hero-warn { margin-left: auto; color: var(--overdue); font-size: 16px; }
.hero-count {
  margin-top: 6px;
  color: var(--overdue);
  font-family: var(--mono); font-size: 30px; font-weight: 700; line-height: 1.1;
}
.hero-title { margin-top: 4px; color: var(--ink-900); font-size: 16px; font-weight: 700; }
.btn {
  margin-top: 12px;
  width: 100%; height: 44px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  border-radius: 6px;
  background: var(--raised-2); border: 1px solid var(--divider);
  color: var(--ink-600); font-family: inherit; font-size: 12px; font-weight: 700;
  cursor: pointer;
  transition: background 120ms var(--ease-out), border-color 120ms var(--ease-out), color 120ms var(--ease-out);
}
.btn:hover { background: #262730; border-color: #34353E; color: var(--ink-900); }
.btn:active { transform: scale(0.99); }
.ring {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--overdue);
  color: var(--overdue); font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ---- timeline rail list ---- */
.list { margin-top: 18px; position: relative; padding-left: 20px; display: flex; flex-direction: column; }
.list::before {
  content: ''; position: absolute; left: 6px; top: 26px; bottom: 26px;
  width: 2px; border-radius: 1px; background: var(--divider);
}
.row {
  position: relative;
  display: flex; align-items: center;
  border-radius: 6px;
  transition: background 120ms var(--ease-out);
}
.row:hover { background: var(--raised); }
.row:active { background: var(--raised-2); }
.row-open {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  min-height: 52px; padding: 8px 8px 8px 6px;
  border: 0; background: transparent; border-radius: 6px;
  text-align: left; font-family: inherit;
  cursor: pointer;
}
.row-done {
  width: 44px; height: 44px; flex-shrink: 0; margin-right: 2px;
  border: 0; background: transparent; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.row-done .ring.neutral { border-color: var(--ink-400); color: var(--ink-400); }
.row-done:hover .ring.neutral { border-color: var(--ink-900); color: var(--ink-900); }
.row::before {
  content: ''; position: absolute; left: -17px; top: 50%;
  width: 8px; height: 8px; margin-top: -4px; border-radius: 50%;
  background: var(--ink-400);
  box-shadow: 0 0 0 3px var(--canvas);
}
.row.soon::before { background: var(--soon); }
.time {
  width: 78px; flex-shrink: 0;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  color: var(--ink-600);
}
.row.soon .time { color: var(--soon); font-weight: 700; }
.row-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.t {
  color: var(--ink-900); font-size: 13px; font-weight: 600; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.c { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.c code { font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--ink-400); letter-spacing: 0.02em; }
.c span { font-size: 11px; color: var(--ink-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- done / restore ---- */
.done-btn {
  margin-top: 14px;
  width: 100%; height: 48px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  border-radius: 6px;
  background: var(--raised); border: 1px solid var(--divider);
  color: var(--ink-600); font-family: inherit; font-size: 12px; font-weight: 700;
  cursor: pointer;
  transition: background 120ms var(--ease-out), border-color 120ms var(--ease-out), color 120ms var(--ease-out);
}
.done-btn:hover { background: var(--raised-2); border-color: #34353E; color: var(--ink-900); }
.done-btn:active { transform: scale(0.99); }
.done-btn .ic { color: var(--ink-400); font-size: 16px; flex-shrink: 0; }
.done-btn .n { font-family: var(--mono); font-weight: 700; color: var(--ink-900); }
.done-btn .rest {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  color: var(--ink-400); font-size: 11px; font-weight: 600;
}
.done-btn:hover .rest { color: var(--ink-600); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .btn:active, .done-btn:active { transform: none; }
}
</style>
</head>
<body>
  <div class="widget">

    <header class="header">
      <div class="brand">
        <span class="wordmark">Deadline</span>
        <span class="count">4 tugas</span>
      </div>
      <div class="head-right">
        <span class="sync">sync 5 mnt</span>
        <button class="icon-btn" type="button" aria-label="Refresh"><i class="ph-bold ph-arrows-clockwise"></i></button>
        <button class="icon-btn" type="button" aria-label="Pengaturan"><i class="ph-bold ph-gear"></i></button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-top">
        <span class="hero-code">IF2040</span>
        <span class="hero-name">Struktur Data</span>
        <i class="ph-bold ph-warning hero-warn" aria-hidden="true"></i>
      </div>
      <div class="hero-count">Terlewat 2 jam</div>
      <div class="hero-title">Tugas Bab 6</div>
      <button class="btn" type="button">
        <span class="ring"><i class="ph-bold ph-check"></i></span>
        Tandai selesai
      </button>
    </section>

    <div class="list">
      <div class="row soon">
        <button class="row-open" type="button">
          <span class="time">6 jam lagi</span>
          <span class="row-title">
            <span class="t">Kuis Jaringan</span>
            <span class="c"><code>IF2040</code><span>Struktur Data</span></span>
          </span>
        </button>
        <button class="row-done" type="button" aria-label="Tandai selesai">
          <span class="ring neutral"><i class="ph-bold ph-check"></i></span>
        </button>
      </div>
      <div class="row">
        <button class="row-open" type="button">
          <span class="time">Besok 10.00</span>
          <span class="row-title">
            <span class="t">Presentasi Metopen</span>
            <span class="c"><code>COMB0051</code><span>Metode Penelitian</span></span>
          </span>
        </button>
        <button class="row-done" type="button" aria-label="Tandai selesai">
          <span class="ring neutral"><i class="ph-bold ph-check"></i></span>
        </button>
      </div>
      <div class="row">
        <button class="row-open" type="button">
          <span class="time">3 hari lagi</span>
          <span class="row-title">
            <span class="t">Laporan Praktikum</span>
            <span class="c"><code>FI1101</code><span>Fisika Dasar</span></span>
          </span>
        </button>
        <button class="row-done" type="button" aria-label="Tandai selesai">
          <span class="ring neutral"><i class="ph-bold ph-check"></i></span>
        </button>
      </div>
    </div>

    <button class="done-btn" type="button">
      <i class="ph-bold ph-check-circle ic" aria-hidden="true"></i>
      <span><span class="n">1</span> tugas selesai</span>
      <span class="rest"><i class="ph-bold ph-arrow-counter-clockwise" aria-hidden="true"></i>Kembalikan</span>
    </button>

  </div>
</body>
</html>
