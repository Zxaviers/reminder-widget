[package]
name = "reminder-widget"
version = "1.2.0"
description = "Always-on-top deadline reminder widget for Moodle/BRONE and iCalendar feeds"
authors = ["Zxaviers"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Zxaviers/reminder-widget"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reminder_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Applies to all targets (Windows x86_64, Android aarch64, etc.)
# Minimizes binary size and memory footprint across platforms
opt-level = "z"        # Optimize for size (not speed)
lto = true             # Link-Time Optimization — removes dead code across crates
codegen-units = 1      # Single codegen unit = better dead code elimination
panic = "abort"        # Drop panic unwinding machinery (~saves 10-15%)
strip = true           # Strip debug symbols from final binary

