name: CI Android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK & NDK components
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.3.13750724"

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test

      - name: Build Android APK (Unsigned PR Build)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: npx tauri android build --apk --target aarch64

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-pr
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
